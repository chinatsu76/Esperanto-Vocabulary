<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esperanto Vortaro</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#202124;--muted:#6b7280;--border:#d9dde3;--accent:#257a43;--accent-soft:#edf7f0;--bad:#a33131;--maybe:#9a6510;--good:#21713d;--shadow:0 8px 28px #00000010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,select,input{font:inherit}button{cursor:pointer}
header{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}header strong{font-size:18px}.wrap{max-width:980px;margin:auto;padding:24px}.muted{color:var(--muted)}
.view{display:none}.view.active{display:block}.title-row{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.title-row h1{margin:0;font-size:28px}.back{border:0;background:transparent;color:#355c44;padding:6px 0}
.stage-grid,.unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.choice{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:left;box-shadow:var(--shadow)}.choice:hover:not(:disabled){border-color:#9dbca8}.choice h2{margin:0 0 8px;font-size:21px}.choice:disabled{opacity:.45;cursor:not-allowed}.badge{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px}
.study-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.study-head .crumb{margin-right:auto;font-weight:600}.control{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px}.progress-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:16px}.progress-line{display:flex;justify-content:space-between;gap:14px;font-size:13px}.progress-bar{height:7px;background:#e7e8ea;border-radius:999px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:var(--accent);width:0}.card{background:#fff;border:1px solid var(--border);border-radius:14px;min-height:420px;padding:34px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;user-select:none}.front{text-align:center}.word{font-size:54px;font-weight:650;letter-spacing:.02em}.rule-question{font-size:36px;line-height:1.45}.hint{margin-top:20px;color:var(--muted);font-size:13px}.back-face{display:none;width:100%;max-width:680px}.back-word{font-size:34px;font-weight:650;margin-bottom:12px}.section{border-top:1px solid var(--border);padding:11px 0}.section-label{font-size:12px;color:var(--muted);margin-bottom:4px}.meaning{font-size:25px;font-weight:650}.tip{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;margin:6px 0}.tip:empty{display:none}.judgement{display:none;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.judgement button{background:#fff;border:1px solid var(--border);border-radius:9px;padding:13px}.judgement .bad{color:var(--bad)}.judgement .maybe{color:var(--maybe)}.judgement .good{color:var(--good)}.nav{display:flex;justify-content:space-between;margin-top:10px}.nav button{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 14px}.empty{background:#fff;border:1px dashed var(--border);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}
dialog{width:min(520px,92vw);border:0;border-radius:12px;padding:0;box-shadow:0 18px 60px #0004}dialog::backdrop{background:#0006}.settings{padding:22px}.settings h2{margin-top:0}.setting{display:flex;gap:10px;padding:8px 0}.dialog-foot{text-align:right;margin-top:16px}.dialog-foot button{padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:7px}.load-error{background:#fff3cd;border:1px solid #e8cd79;border-radius:10px;padding:16px;margin-bottom:16px}.load-error input{margin-top:10px}.missing-list{margin:6px 0 0;padding-left:20px}
@media(max-width:620px){.wrap{padding:14px}.word{font-size:43px}.rule-question{font-size:29px}.card{min-height:380px;padding:22px}.judgement{grid-template-columns:1fr}.progress-line{display:block}.study-head .crumb{width:100%;margin-bottom:4px}}
</style>
</head>
<body>
<header><strong>Esperanto Vortaro</strong></header>
<div class="wrap">
  <div id="loadError" class="load-error" hidden>
    <strong>JSONを自動読込できないファイルがあります。</strong>
    <ul id="missingList" class="missing-list"></ul>
    <span class="muted">HTMLを file:// で直接開いた場合はブラウザの制限が原因です。下から stage0.json ～ stage4.json を選択できます。</span><br>
    <input id="filePicker" type="file" accept="application/json,.json" multiple>
  </div>

  <section id="stageView" class="view active">
    <div class="title-row"><div><h1>Stageを選択</h1><div class="muted">単語登録不要のエスペラント学習帳</div></div></div>
    <div class="stage-grid">
      <button class="choice" id="stage0Btn" disabled><span class="badge">100項目</span><h2>Stage 0</h2><div class="muted">文法部品・人称・数・基本色</div></button>
      <button class="choice" id="stage1Btn" disabled><span class="badge">600語</span><h2>Stage 1</h2><div class="muted">基礎語彙</div></button>
      <button class="choice" id="stage2Btn" disabled><span class="badge">600語</span><h2>Stage 2</h2><div class="muted">初級後半〜中級入口</div></button>
      <button class="choice" id="stage3Btn" disabled><span class="badge">900語</span><h2>Stage 3</h2><div class="muted">中級語彙</div></button>
      <button class="choice" id="stage4Btn" disabled><span class="badge">1,100語</span><h2>Stage 4</h2><div class="muted">中上級語彙</div></button>
      <button class="choice" disabled><span class="badge">予定 1,300語</span><h2>Stage 5</h2><div class="muted">未実装</div></button>
    </div>
  </section>

  <section id="unitView" class="view">
    <div class="title-row"><div><button class="back" data-back="stage">← Stage一覧</button><h1 id="unitTitle"></h1><div id="unitSubtitle" class="muted"></div></div></div>
    <div id="unitGrid" class="unit-grid"></div>
  </section>

  <section id="studyView" class="view">
    <div class="study-head">
      <button class="back" data-back="unit">← 一覧</button>
      <div id="crumb" class="crumb"></div>
      <button id="shuffleBtn" class="control">ランダム</button>
      <select id="filterSelect" class="control" aria-label="表示対象">
        <option value="all">すべて表示</option>
        <option value="weak">あやしい＋覚えていない表示</option>
        <option value="bad">覚えていない表示</option>
      </select>
      <button id="settingsBtn" class="control">表示設定</button>
    </div>
    <div class="progress-panel">
      <div class="progress-line"><span id="position"></span><span id="summary"></span></div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>
    <div id="empty" class="empty" hidden>この条件に該当するカードはありません。</div>
    <div id="cardArea">
      <div id="card" class="card" tabindex="0">
        <div id="front" class="front"><div id="frontWord" class="word"></div><div class="hint">クリックして裏面を表示</div></div>
        <div id="backFace" class="back-face">
          <div id="backWord" class="back-word"></div>
          <div id="meaningSection" class="section"><div id="meaningLabel" class="section-label">意味</div><div id="meaning" class="meaning"></div></div>
          <div id="posSection" class="section"><div class="section-label">分類</div><div id="pos"></div></div>
          <div id="noteSection" class="section"><div class="section-label">使い方・補足</div><div id="note"></div></div>
          <div id="exampleSection" class="section"><div class="section-label">例</div><div id="exampleEo"></div><div id="exampleJa" class="muted"></div></div>
          <div id="relatedSection" class="section"><div class="section-label">関連</div><div id="related"></div></div>
          <div id="tipsSection" class="section"><div class="section-label">Tips</div><div id="tipsContainer"></div></div>
        </div>
      </div>
      <div id="judgement" class="judgement">
        <button class="bad" data-status="bad">覚えていない</button>
        <button class="maybe" data-status="maybe">あやしい</button>
        <button class="good" data-status="good">覚えた</button>
      </div>
      <div class="nav"><button id="prevBtn">← 前へ</button><button id="nextBtn">次へ →</button></div>
    </div>
  </section>
</div>

<dialog id="settingsDialog"><div class="settings"><h2>裏面の表示設定</h2>
<label class="setting"><input type="checkbox" data-setting="meaning" checked>答え・日本語訳</label>
<label class="setting"><input type="checkbox" data-setting="pos" checked>品詞・分類</label>
<label class="setting"><input type="checkbox" data-setting="note" checked>使い方・補足</label>
<label class="setting"><input type="checkbox" data-setting="example" checked>例文・用例</label>
<label class="setting"><input type="checkbox" data-setting="exampleJa" checked>例文の日本語訳</label>
<label class="setting"><input type="checkbox" data-setting="related" checked>関連語・関連形</label>
<label class="setting"><input type="checkbox" data-setting="tips" checked>Tips</label>
<div class="dialog-foot"><button id="closeSettings">閉じる</button></div></div></dialog>

<script>
const databases={0:null,1:null,2:null,3:null,4:null};
let currentStage=1,currentUnit=1,currentList=[],currentIndex=0,isBack=false;
function loadStoredStatus(stage){
  try{return JSON.parse(localStorage.getItem(`eo-stage${stage}-status`)||'{}')}
  catch(e){return {}}
}
const statuses={
  0:loadStoredStatus(0),
  1:loadStoredStatus(1),
  2:loadStoredStatus(2),
  3:loadStoredStatus(3),
  4:loadStoredStatus(4)
};
const settings=Object.assign({meaning:true,pos:true,note:true,example:true,exampleJa:true,related:true,tips:true},JSON.parse(localStorage.getItem('eo-card-settings')||'{}'));
const $=id=>document.getElementById(id);
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}
function db(){return databases[currentStage]}
function status(){return statuses[currentStage]}
function storageKey(){return `eo-stage${currentStage}-status`}
async function loadOne(stage){
  try{
    const r=await fetch(`./stage${stage}.json`,{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    databases[stage]=data;
    return true;
  }catch(e){return false}
}
async function loadData(){
  const results=await Promise.all([0,1,2,3,4].map(loadOne));
  afterLoad();
  if(results.some(v=>!v))showLoadError();
}
function showLoadError(){
  const missing=[];
  for(let stage=0;stage<=4;stage++){
    if(!databases[stage])missing.push(`stage${stage}.json`);
  }
  $('missingList').innerHTML=missing.map(x=>`<li>${x}</li>`).join('');
  $('loadError').hidden=missing.length===0;
}
$('filePicker').addEventListener('change',async e=>{
  for(const f of e.target.files){
    try{
      const data=JSON.parse(await f.text());
      const stage=Number(data?.metadata?.stage ?? data?.words?.[0]?.stage);
      if(Number.isInteger(stage)&&stage>=0&&stage<=4)databases[stage]=data;
    }catch(err){}
  }
  afterLoad();showLoadError();
});
function afterLoad(){
  for(let stage=0;stage<=4;stage++){
    const btn=$(`stage${stage}Btn`);
    if(btn)btn.disabled=!databases[stage];
  }
}
function openStage(stage){
  if(!databases[stage]){showLoadError();return}
  currentStage=stage;currentUnit=1;renderUnits();showView('unitView');
}
for(let stage=0;stage<=4;stage++){
  $(`stage${stage}Btn`).addEventListener('click',()=>openStage(stage));
}
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.back==='stage'?'stageView':'unitView')));
function renderUnits(){
  const data=db();if(!data)return;
  const g=$('unitGrid');g.innerHTML='';
  $('unitTitle').textContent=`Stage ${currentStage}`;
  if(currentStage===0){
    $('unitSubtitle').textContent=data.metadata?.description||'基本活用';
    const total=data.words.length,learned=data.words.filter(w=>status()[w.id]).length;
    const btn=document.createElement('button');btn.className='choice';
    btn.innerHTML=`<span class="badge">${learned}/${total} 学習済み</span><h2>${data.metadata?.title||'基礎コア'}</h2><div class="muted">${total}項目</div>`;
    btn.onclick=()=>startUnit(1);g.appendChild(btn);return;
  }
  $('unitSubtitle').textContent=data.metadata?.description||'100語単位で選択';
  const maxUnit=Math.max(...data.words.map(w=>w.unit||1));
  for(let u=1;u<=maxUnit;u++){
    const unitWords=data.words.filter(w=>w.unit===u);if(!unitWords.length)continue;
    const a=(u-1)*100+1,b=(u-1)*100+unitWords.length;
    const btn=document.createElement('button');btn.className='choice';
    const learned=unitWords.filter(w=>status()[w.id]).length;
    const theme=data.metadata?.unitThemes?.find(x=>Number(x.unit)===u)?.theme;
    btn.innerHTML=`<span class="badge">${learned}/${unitWords.length} 学習済み</span><h2>${String(a).padStart(3,'0')}–${String(b).padStart(3,'0')}</h2><div class="muted">Unit ${u}${theme?`｜${theme}`:''}</div>`;
    btn.onclick=()=>startUnit(u);g.appendChild(btn);
  }
}
function startUnit(u){currentUnit=u;$('filterSelect').value='all';rebuildList();showView('studyView')}
function rebuildList(){
  if(!db())return;
  const mode=$('filterSelect').value,s=status();
  let list=db().words.filter(w=>(w.unit||1)===currentUnit);
  if(mode==='weak')list=list.filter(w=>s[w.id]==='maybe'||s[w.id]==='bad');
  if(mode==='bad')list=list.filter(w=>s[w.id]==='bad');
  currentList=list;currentIndex=0;
  if(currentStage===0)$('crumb').textContent=`Stage 0 › ${db().metadata?.title||'基礎コア'}`;
  else $('crumb').textContent=`Stage ${currentStage} › ${String((currentUnit-1)*100+1).padStart(3,'0')}–${String((currentUnit-1)*100+db().words.filter(w=>w.unit===currentUnit).length).padStart(3,'0')}`;
  renderCard();
}
$('filterSelect').addEventListener('change',rebuildList);
$('shuffleBtn').addEventListener('click',()=>{for(let i=currentList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[currentList[i],currentList[j]]=[currentList[j],currentList[i]]}currentIndex=0;renderCard()});
function renderCard(){
  const empty=currentList.length===0;$('empty').hidden=!empty;$('cardArea').hidden=empty;if(empty){renderProgress();return}
  const x=currentList[currentIndex];isBack=false;$('front').style.display='block';$('backFace').style.display='none';$('judgement').style.display='none';
  $('frontWord').textContent=x.word;$('frontWord').classList.toggle('rule-question',currentStage===0);
  $('backWord').textContent=currentStage===0?'答え':x.word;
  $('meaningLabel').textContent=currentStage===0?'答え':'意味';
  $('meaning').textContent=(x.meanings||[]).join('、');$('pos').textContent=x.partOfSpeech||'';$('note').textContent=x.note||'';
  $('exampleEo').textContent=x.example?.eo||'';$('exampleJa').textContent=x.example?.ja||'';
  $('related').textContent=(x.relatedWords||[]).map(v=>`${v.word}：${v.meaning}`).join(' / ');
  renderTips(x.tips||{});
  applySettings();renderProgress();
}
function section(id,show,has=true){$(id).style.display=show&&has?'':'none'}
function renderTips(tips){
  const box=$('tipsContainer');
  box.innerHTML='';
  const labels={origin:'語源',japaneseHint:'覚え方',morphology:'語構成',rule:'規則',memory:'覚え方',pitfall:'注意'};
  Object.entries(tips).forEach(([key,value])=>{
    if(!value)return;
    const div=document.createElement('div');
    div.className='tip';
    const label=labels[key]||key;
    div.textContent=`${label}：${value}`;
    box.appendChild(div);
  });
}
function applySettings(){if(!currentList.length)return;const x=currentList[currentIndex];section('meaningSection',settings.meaning,(x.meanings||[]).length);section('posSection',settings.pos,!!x.partOfSpeech);section('noteSection',settings.note,!!x.note);section('exampleSection',settings.example,!!(x.example?.eo||x.example?.ja));$('exampleJa').style.display=settings.exampleJa?'':'none';section('relatedSection',settings.related,(x.relatedWords||[]).length);section('tipsSection',settings.tips,!!(x.tips&&Object.values(x.tips).some(Boolean)))}
function flip(){if(isBack||!currentList.length)return;isBack=true;$('front').style.display='none';$('backFace').style.display='block';$('judgement').style.display='grid'}
$('card').addEventListener('click',flip);$('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
document.querySelectorAll('#judgement button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const x=currentList[currentIndex];status()[x.id]=b.dataset.status;localStorage.setItem(storageKey(),JSON.stringify(status()));renderUnits();if(currentIndex<currentList.length-1)currentIndex++;renderCard()}));
$('nextBtn').onclick=()=>{if(currentIndex<currentList.length-1){currentIndex++;renderCard()}};$('prevBtn').onclick=()=>{if(currentIndex>0){currentIndex--;renderCard()}};
function renderProgress(){
  const unit=db()?db().words.filter(w=>(w.unit||1)===currentUnit):[],s=status();
  const learned=unit.filter(w=>s[w.id]).length,good=unit.filter(w=>s[w.id]==='good').length,maybe=unit.filter(w=>s[w.id]==='maybe').length,bad=unit.filter(w=>s[w.id]==='bad').length,total=unit.length||1;
  $('position').textContent=currentList.length?`${currentIndex+1} / ${currentList.length}`:'0 / 0';
  $('summary').textContent=`学習済 ${learned}/${unit.length}｜覚えた ${good}｜あやしい ${maybe}｜未習得 ${bad}`;
  $('progressFill').style.width=`${learned/total*100}%`;
}
$('settingsBtn').onclick=()=>$('settingsDialog').showModal();$('closeSettings').onclick=()=>$('settingsDialog').close();document.querySelectorAll('[data-setting]').forEach(c=>{const k=c.dataset.setting;c.checked=settings[k];c.onchange=()=>{settings[k]=c.checked;localStorage.setItem('eo-card-settings',JSON.stringify(settings));applySettings()}});
loadData();
</script>
</body></html>
